# Profil de développement local
logging.level.com.riftmind=DEBUG

# PostgreSQL lancé via `docker compose up -d postgres`.
# Dans le conteneur backend, ces valeurs sont surchargées par les variables SPRING_DATASOURCE_*.
spring.datasource.url=jdbc:postgresql://localhost:5432/riftmind
spring.datasource.username=riftmind
spring.datasource.password=riftmind

# Surcharges personnelles : créer application-local.properties (ignoré par git)
spring.config.import=optional:classpath:application-local.properties
