spring.application.name=riftmind-backend
server.port=8080

# Profil actif par défaut en local. En prod : SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# --- Base de données ---
# Le schéma est géré exclusivement par Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Actuator : expose uniquement l'endpoint de santé
management.endpoints.web.exposure.include=health

# Erreurs au format RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true
