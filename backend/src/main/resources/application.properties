spring.application.name=riftmind-backend
server.port=8080

# Virtual threads (Java 21+) : les appels bloquants à l'API Riot ne monopolisent pas de threads système
spring.threads.virtual.enabled=true

# Profil actif par défaut en local. En prod : SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# --- Base de données ---
# Le schéma est géré exclusivement par Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Actuator : expose uniquement l'endpoint de santé
management.endpoints.web.exposure.include=health

# Erreurs au format RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true

# --- API Riot (voir docs/riot-api.md et RiotProperties) ---
# Obligatoire : l'application refuse de démarrer si la clé est vide.
riot.api-key=${RIOT_API_KEY:}
# Valeurs par défaut adaptées à une clé de développement (à augmenter avec une clé de production)
riot.rate-limit.short-window.requests=20
riot.rate-limit.short-window.period=1s
riot.rate-limit.long-window.requests=100
riot.rate-limit.long-window.period=2m
riot.rate-limit.max-wait=5s
# Délai minimum entre deux mises à jour d'un même joueur
riot.refresh-cooldown=2m
# Délais maximum des appels à Riot (connexion, puis attente de la réponse)
riot.connect-timeout=5s
riot.read-timeout=10s
