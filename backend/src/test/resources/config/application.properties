# Configuration ajoutée pour les tests uniquement.
# Placée dans config/ : Spring la charge EN PLUS de src/main/resources/application.properties
# (un fichier application.properties à la racine de src/test/resources masquerait celui du main).

# Fausse clé : les tests ne doivent jamais appeler la vraie API Riot
riot.api-key=RGAPI-test-key-not-a-real-key

# Pas de copie de Data Dragon pendant les tests (les tests de la copie utilisent un faux Data Dragon local)
assets.sync-enabled=false
assets.directory=target/test-assets
