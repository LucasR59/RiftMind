# Démarre toute la stack docker compose et vérifie que front -> back -> base répondent, puis la recherche d'un
# joueur de bout en bout avec la fausse API Riot (WireMock, profil e2e : voir e2e/README.md).
name: Smoke test (docker compose)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Stack complète
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Le backend refuse de démarrer sans clé : on fournit une fausse clé (aucun appel réel à Riot ici)
      RIOT_API_KEY: RGAPI-ci-placeholder-not-a-real-key
      # Fausse API Riot : tous les appels du backend partent vers WireMock
      RIOT_BASE_URL: http://wiremock:8080
    steps:
      - uses: actions/checkout@v7

      - name: Valider compose.yaml
        run: docker compose config -q

      - name: Démarrer la stack
        run: |
          docker compose --profile e2e up -d --build --wait postgres
          docker compose --profile e2e up -d --build wiremock backend frontend

      - name: Attendre le backend (healthcheck Actuator)
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend UP après ~$((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "Le backend n'a pas démarré à temps"; exit 1

      - name: Vérifier front -> proxy -> back
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173/api/ping | grep -q '"status":"ok"'; then
              curl -s http://localhost:5173/api/ping; echo; exit 0
            fi
            sleep 2
          done
          echo "Le frontend ne relaie pas /api/ping"; exit 1

      - name: Vérifier la page d'accueil
        run: curl -sf http://localhost:5173/ | grep -q '<div id="app">'

      - name: Vérifier la recherche d'un joueur (front -> back -> fausse API Riot -> base)
        run: |
          set -euo pipefail
          api=http://localhost:5173/api
          # Première recherche : Account-V1, Summoner-V4, League-V4 puis Match-V5 (3 parties), tout enregistré
          player=$(curl -sf "$api/players/euw1/Joueur%20Test/EUW")
          echo "$player" | jq -e '.gameName == "Joueur Test" and .ranks[0].tier == "CHALLENGER"'
          puuid=$(echo "$player" | jq -r .puuid)
          curl -sf "$api/players/$puuid/matches" | jq -e '.items | length == 3'
          curl -sf "$api/players/$puuid/summary" | jq -e '.games == 3'
          curl -sf "$api/players/$puuid/champions" | jq -e '.[0].championName == "Kalista"'
          # Riot ID inconnu : 404 au format RFC 9457
          code=$(curl -s -o unknown.json -w '%{http_code}' "$api/players/euw1/Inconnu/EUW")
          test "$code" = 404
          jq -e '.code == "NOT_FOUND"' unknown.json

      - name: Vérifier les migrations Flyway
        run: |
          docker compose exec -T postgres \
            psql -U riftmind -d riftmind -tAc "select count(*) from flyway_schema_history where success" \
            | grep -qv '^0$'

      - name: Logs
        if: failure()
        run: docker compose --profile e2e logs --no-color

      - name: Arrêter la stack
        if: always()
        run: docker compose --profile e2e down -v
