# =============================================================
# RiftMind - stack de développement local
#
#   docker compose up -d                   # postgres + backend + frontend
#   docker compose --profile tools up -d   # + Adminer (UI base de données)
#   docker compose up -d postgres          # uniquement la base (back/front lancés depuis l'IDE)
#   docker compose logs -f backend
#   docker compose --profile tools down    # stoppe tout, Adminer compris (garde les données)
#   docker compose --profile tools down -v # stoppe et supprime les volumes (reset BDD)
#
#   Tests de bout en bout, avec une fausse API Riot (WireMock) au lieu de la vraie :
#   RIOT_BASE_URL=http://wiremock:8080 docker compose --profile e2e up -d
#
# Les valeurs par défaut peuvent être surchargées dans un fichier .env (voir .env.example).
# =============================================================
name: riftmind

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riftmind}
      POSTGRES_USER: ${POSTGRES_USER:-riftmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riftmind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-riftmind}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-riftmind}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-riftmind}
      # Clé API Riot lue depuis .env (vide par défaut pour que la CI démarre sans clé)
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      # Fausse API Riot (profil e2e) : http://wiremock:8080. Vide : la vraie API Riot
      RIOT_BASE_URL: ${RIOT_BASE_URL:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${BACKEND_DEBUG_PORT:-5005}:5005" # debug distant (JDWP) depuis l'IDE
    volumes:
      - ./backend:/app
      - maven-repo:/root/.m2 # cache des dépendances Maven entre deux démarrages
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_PROXY_TARGET: http://backend:8080
      VITE_USE_POLLING: "true" # nécessaire pour le hot reload sur un volume monté depuis Windows/macOS
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules # node_modules Linux, isolé de celui de l'hôte
    depends_on:
      - backend

  adminer:
    image: adminer:latest
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres

  # Fausse API Riot pour les tests de bout en bout (e2e/README.md). Elle sert les vraies réponses anonymisées des
  # tests du backend : un seul jeu de données pour les tests unitaires et les tests de bout en bout.
  wiremock:
    image: wiremock/wiremock:3.13.1
    profiles: [e2e]
    command: ["--disable-banner", "--global-response-templating=false"]
    ports:
      - "${WIREMOCK_PORT:-8089}:8080"
    volumes:
      - ./e2e/wiremock/mappings:/home/wiremock/mappings:ro
      - ./backend/src/test/resources/riot:/home/wiremock/__files/riot:ro

volumes:
  postgres-data:
  maven-repo:
  frontend-node-modules:
